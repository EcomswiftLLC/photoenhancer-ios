name: iOS build, test and screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Every screen the debug build can open directly with `-cvScreen <name>` (see Sources/App/DebugScreens.swift).
  SCREENS: "onboarding home enhance enhance-tools export batch settings licenses"
  # The store captures (`-cvScreen shot-<name>`, see Sources/App/StoreScreens.swift): real bundled photos, real engine
  # output, real views. Saved under exactly these names in the store-iphone and store-ipad artifacts.
  STORE_SHOTS: "home enhance-result compare unblur colorize restore portrait batch export settings"
  BUNDLE_ID: com.ecomswift.photoenhancer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Fetch Core ML models (models-v1 release, when published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-models.sh
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p build
          DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/')
          echo "Simulator: $DEST"
          xcodebuild test -project Clarivo.xcodeproj -scheme Clarivo -destination "id=$DEST" -only-testing:ClarivoTests CODE_SIGNING_ALLOWED=NO | tee build/test.log | grep -E "error:|warning: unre|Test Suite|Test Case.*(passed|failed|skipped)|Executed|BUILD|TEST " | tail -n 150
      - name: Compiler errors (if any)
        if: failure()
        run: grep -E "error:" build/test.log | sort -u | head -80 || true
      - name: Collect crash evidence
        if: failure()
        run: |
          mkdir -p crash
          ls -la ~/Library/Logs/DiagnosticReports > crash/listing.txt 2>&1 || true
          cp ~/Library/Logs/DiagnosticReports/Clarivo* crash/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/*.ips crash/ 2>/dev/null || true
          xcrun simctl spawn booted log show --last 10m --predicate 'process == "Clarivo"' > crash/simulator-log.txt 2>&1 || true
          ls crash
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-reports-unit
          path: crash
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore

  quality:
    # Every model on the bundled samples: time and peak memory per image, before/after PNGs.
    # The simulator has no Neural Engine (and no Core ML GPU path), so these are CPU times on the CI Mac.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC"
      - name: Fetch Core ML models (models-v1 release, when published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-models.sh
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Quality and performance run
        run: |
          set -o pipefail
          mkdir -p build/quality
          DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/')
          if [ -z "$DEST" ]; then DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/'); fi
          echo "Simulator: $DEST"
          sysctl -n machdep.cpu.brand_string || true
          TEST_RUNNER_CV_QUALITY=1 xcodebuild test -project Clarivo.xcodeproj -scheme Clarivo -destination "id=$DEST" \
            -only-testing:ClarivoTests/QualityPerformanceTests CODE_SIGNING_ALLOWED=NO | tee build/quality.log | grep -E "error:|Test Case|Executed|TEST |\"seconds\"|\"case\"|peakFootprint|status" | tail -n 150
          cp Models/models-manifest.json build/quality/ 2>/dev/null || true
          ls -la build/quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality
          path: |
            build/quality
            build/quality.log
          if-no-files-found: ignore

  screenshots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC"
      - name: Fetch Core ML models (models-v1 release, when published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-models.sh
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          mkdir -p build
          DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro Max" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/')
          if [ -z "$DEST" ]; then DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/'); fi
          echo "iPhone simulator: $DEST"
          echo "$DEST" > build/dest.txt
          xcodebuild build -project Clarivo.xcodeproj -scheme Clarivo -configuration Debug -destination "id=$DEST" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | tee build/shots-build.log | grep -E "error:|BUILD" | tail -n 40
      - name: Take screenshots and store captures
        run: bash .github/scripts/take-shots.sh "$(cat build/dest.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-iphone
          path: store
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore

  screenshots-ipad:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC"
      - name: Fetch Core ML models (models-v1 release, when published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-models.sh
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          mkdir -p build
          DEST=$(xcrun simctl list devices available | grep -E "iPad Pro 13-inch" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/')
          if [ -z "$DEST" ]; then DEST=$(xcrun simctl list devices available | grep -E "iPad.*13-inch" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/'); fi
          echo "iPad simulator: $DEST"
          echo "$DEST" > build/dest.txt
          xcodebuild build -project Clarivo.xcodeproj -scheme Clarivo -configuration Debug -destination "id=$DEST" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | tee build/shots-build.log | grep -E "error:|BUILD" | tail -n 40
      - name: Take screenshots and store captures
        run: bash .github/scripts/take-shots.sh "$(cat build/dest.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-ipad
          path: store
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ipad
          path: shots
          if-no-files-found: ignore

  ipad-landscape:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC"
      - name: Fetch Core ML models (models-v1 release, when published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-models.sh
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: UI tests on iPad (landscape screens and first-run flow)
        run: |
          set -o pipefail
          mkdir -p build
          DEST=$(xcrun simctl list devices available | grep -E "iPad Pro 13-inch" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/')
          if [ -z "$DEST" ]; then DEST=$(xcrun simctl list devices available | grep -E "iPad.*13-inch" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/'); fi
          echo "iPad simulator: $DEST"
          xcrun simctl boot "$DEST" || true
          xcrun simctl bootstatus "$DEST" -b || true
          rm -rf build/ui.xcresult
          xcodebuild test -project Clarivo.xcodeproj -scheme Clarivo -destination "id=$DEST" -only-testing:ClarivoUITests -resultBundlePath build/ui.xcresult CODE_SIGNING_ALLOWED=NO | tee build/ui-test.log | grep -E "error:|Test Case|Executed|TEST " | tail -n 80
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p shots-landscape
          xcrun xcresulttool export attachments --path build/ui.xcresult --output-path shots-landscape || true
          ls shots-landscape | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ipad-landscape
          path: shots-landscape
          if-no-files-found: ignore
      - name: Collect crash evidence
        if: failure()
        run: |
          mkdir -p crash
          cp ~/Library/Logs/DiagnosticReports/Clarivo* crash/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/*.ips crash/ 2>/dev/null || true
          xcrun simctl spawn booted log show --last 15m --predicate 'process == "Clarivo"' > crash/simulator-log.txt 2>&1 || true
          xcrun xcresulttool get test-results summary --path build/ui.xcresult > crash/xcresult-summary.json 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-reports-ipad
          path: crash
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-logs
          path: build/ui-test.log
          if-no-files-found: ignore

  iphone-landscape:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC"
      - name: Fetch Core ML models (models-v1 release, when published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-models.sh
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: UI tests on iPhone (landscape screens and first-run flow)
        run: |
          set -o pipefail
          mkdir -p build
          DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro Max" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/')
          if [ -z "$DEST" ]; then DEST=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/'); fi
          echo "iPhone simulator: $DEST"
          xcrun simctl boot "$DEST" || true
          xcrun simctl bootstatus "$DEST" -b || true
          rm -rf build/ui-iphone.xcresult
          xcodebuild test -project Clarivo.xcodeproj -scheme Clarivo -destination "id=$DEST" -only-testing:ClarivoUITests -resultBundlePath build/ui-iphone.xcresult CODE_SIGNING_ALLOWED=NO | tee build/ui-test-iphone.log | grep -E "error:|Test Case|Executed|TEST " | tail -n 80
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p shots-landscape-iphone
          xcrun xcresulttool export attachments --path build/ui-iphone.xcresult --output-path shots-landscape-iphone || true
          ls shots-landscape-iphone | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-iphone-landscape
          path: shots-landscape-iphone
          if-no-files-found: ignore
      - name: Collect crash evidence
        if: failure()
        run: |
          mkdir -p crash
          cp ~/Library/Logs/DiagnosticReports/Clarivo* crash/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/*.ips crash/ 2>/dev/null || true
          xcrun simctl spawn booted log show --last 15m --predicate 'process == "Clarivo"' > crash/simulator-log.txt 2>&1 || true
          xcrun xcresulttool get test-results summary --path build/ui-iphone.xcresult > crash/xcresult-summary.json 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-reports-iphone
          path: crash
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-logs-iphone
          path: build/ui-test-iphone.log
          if-no-files-found: ignore
